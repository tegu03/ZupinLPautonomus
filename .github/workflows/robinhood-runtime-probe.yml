name: Robinhood Runtime Capability Probe

on:
  push:
    branches:
      - phase-1/chain-capability-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e "."

      - name: Run read-only Robinhood probe
        id: probe
        continue-on-error: true
        run: |
          set +e
          python scripts/probe_robinhood.py > robinhood-runtime-evidence.json
          status=$?
          cat robinhood-runtime-evidence.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-runtime-evidence-${{ github.sha }}
          path: robinhood-runtime-evidence.json
          retention-days: 14

      - name: Require PROVEN result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("robinhood-runtime-evidence.json").read_text())
          status = payload.get("status")
          if status != "PROVEN":
              raise SystemExit(f"Robinhood runtime capability is {status!r}; refusing to promote evidence")
          print("Robinhood runtime capability: PROVEN")
          PY
