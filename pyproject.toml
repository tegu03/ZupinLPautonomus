[project]
name = "robinhood-lp-autonomous"
version = "0.1.0"
description = "Robinhood Chain Uniswap V3/V4 autonomous LP fee-farming system"
requires-python = ">=3.11,<3.14"
dependencies = [
  "web3>=7,<8",
  "eth-abi>=5,<6",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: opt-in tests requiring a live Robinhood Chain RPC",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
